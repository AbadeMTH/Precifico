<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Precifico • Detalhes do Produto</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header>
    <div class="logotipo">Precifico</div>
    <div class="cabecalho-usuario">
        <span>Vendedor: <strong id="nome-vendedor-logado">...</strong></span>
        <a href="produtos.html" class="botao botao-pequeno" style="text-decoration:none;">Meus Produtos</a>
    </div>
</header>

<main>
    <button class="voltar" onclick="window.location.href='produtos.html'">← Voltar para lista de produtos</button>

    <div id="mensagens"></div>

    <div class="cabecalho-secao">
        <div>
            <h1 id="detalhe-nome">Carregando...</h1>
        </div>
        <span id="detalhe-selo" class="selo selo-disponivel" style="font-size: 13px; padding: 6px 14px;">
            ...
        </span>
    </div>

    <div class="grade">
        <div class="painel">
            <h2>Dados Gerais do Produto</h2>
            <div style="text-align: center; margin-bottom: 20px;">
                <img id="detalhe-imagem" src="img/sem-foto.jpg" alt="Foto do produto" class="imagem-detalhe"
                     onerror="this.onerror=null; this.src='img/sem-foto.jpg';">
            </div>

            <div class="campos" style="grid-template-columns: 1fr;">
                <div>
                    <label>Código do Produto</label>
                    <div id="detalhe-codigo" style="font-size: 16px; font-weight: 600; padding: 8px 0;">—</div>
                </div>

                <div>
                    <label>Descrição do Produto</label>
                    <div id="detalhe-descricao" class="descricao-detalhe">—</div>
                </div>

                <div>
                    <label>URL da Imagem</label>
                    <small style="display:block; word-break: break-all; margin-top: 4px;">
                        <a id="detalhe-url-imagem" href="#" target="_blank" style="color: var(--cor-marca);">—</a>
                    </small>
                </div>
            </div>
        </div>

        <div class="pilha">
            <div class="painel cartao-preco">
                <h2>Análise Financeira</h2>

                <div class="metricas" style="border-top: none; padding-top: 0; margin-top: 0;">
                    <div>
                        <small>Valor de Custo</small>
                        <strong id="detalhe-custo" style="color: var(--cor-texto);">R$ 0,00</strong>
                    </div>
                    <div>
                        <small>Preço de Venda Praticado</small>
                        <strong id="detalhe-venda" style="color: var(--cor-marca);">R$ 0,00</strong>
                    </div>
                </div>

                <div class="metricas">
                    <div>
                        <small>Lucro Financeiro (R$)</small>
                        <strong id="detalhe-lucro">R$ 0,00</strong>
                    </div>
                    <div>
                        <small>Margem Efetiva sobre Custo</small>
                        <strong id="detalhe-margem">0,0%</strong>
                    </div>
                </div>

                <div id="box-diagnostico" class="aviso sucesso" style="margin-top: 24px;">
                    <strong>Diagnóstico Comercial:</strong><br>
                    <span id="detalhe-diagnostico">...</span>
                </div>
            </div>

            <div class="painel">
                <h2>Ações do Produto</h2>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <a id="btn-editar" href="#" class="botao botao-primario" style="justify-content: center; text-decoration: none;">
                        Editar este produto
                    </a>
                    <button id="btn-situacao" type="button" class="botao" style="justify-content: center;">
                        Alterar situação
                    </button>
                    <button id="btn-excluir" type="button" class="botao botao-perigo" style="justify-content: center;">
                        Excluir produto
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script>
    const vendedor = exigirAutenticacao();
    const paramsUrl = new URLSearchParams(window.location.search);
    const idProduto = paramsUrl.get('id');

    if (!idProduto) {
        window.location.href = 'produtos.html';
    }

    async function carregarDetalhes() {
        try {
            const { dados } = await requisitarComando('/ControleProduto', {
                btnop: 'ConsultarPorId',
                id: idProduto
            }, 'GET');

            if (!dados.sucesso || !dados.produto) {
                salvarMensagemFlash('perigo', dados.msgErro || 'Produto não encontrado.');
                window.location.href = 'produtos.html';
                return;
            }

            const p = dados.produto;
            const prec = p.precificacao || {};
            const custo = prec.custoProduto || 0.0;
            const venda = prec.valorVenda || 0.0;
            const lucro = prec.lucro || 0.0;
            const margem = dados.margemEfetiva !== undefined ? dados.margemEfetiva : (prec.margemEfetiva || 0.0);
            const diagnostico = dados.diagnosticoComercial || 'Sem precificação cadastrada.';
            const disponivel = String(p.situacao).toUpperCase() === 'DISPONIVEL';

            document.title = `Precifico • Detalhes de ${p.nome}`;
            document.getElementById('detalhe-nome').textContent = p.nome;

            const selo = document.getElementById('detalhe-selo');
            selo.textContent = p.situacao;
            selo.className = `selo ${disponivel ? 'selo-disponivel' : 'selo-vendido'}`;

            const urlFoto = (p.imagem && p.imagem.trim() !== '') ? p.imagem : 'img/sem-foto.jpg';
            const img = document.getElementById('detalhe-imagem');
            img.src = urlFoto;
            img.alt = p.nome;

            document.getElementById('detalhe-codigo').textContent = p.codigoProduto;
            document.getElementById('detalhe-descricao').textContent = p.descricao;

            const linkImg = document.getElementById('detalhe-url-imagem');
            linkImg.href = p.imagem || '#';
            linkImg.textContent = p.imagem || '—';

            document.getElementById('detalhe-custo').textContent = `R$ ${formatarDecimal(custo, 2)}`;
            document.getElementById('detalhe-venda').textContent = `R$ ${formatarDecimal(venda, 2)}`;

            const elLucro = document.getElementById('detalhe-lucro');
            elLucro.textContent = `R$ ${formatarDecimal(lucro, 2)}`;
            elLucro.style.color = lucro >= 0 ? 'var(--cor-marca)' : '#9a382c';

            document.getElementById('detalhe-margem').textContent = `${formatarDecimal(margem, 1)}%`;

            const boxDiag = document.getElementById('box-diagnostico');
            boxDiag.className = `aviso ${lucro >= 0 ? 'sucesso' : 'perigo'}`;
            document.getElementById('detalhe-diagnostico').textContent = diagnostico;

            document.getElementById('btn-editar').href = `formulario_produto.html?id=${p.id}`;

            const btnSituacao = document.getElementById('btn-situacao');
            btnSituacao.textContent = disponivel ? 'Alterar para Vendido' : 'Reativar Produto';
            btnSituacao.onclick = async () => {
                const resp = await requisitarComando('/ControleProduto', { btnop: 'AlterarSituacao', id: p.id }, 'POST');
                if (resp.dados.sucesso) {
                    salvarMensagemFlash('sucesso', resp.dados.msgSucesso);
                    window.location.href = 'produtos.html';
                } else {
                    exibirAlerta('mensagens', 'perigo', resp.dados.msgErro);
                }
            };

            const btnExcluir = document.getElementById('btn-excluir');
            btnExcluir.onclick = async () => {
                if (!confirm('Deseja realmente excluir este produto?')) return;
                const resp = await requisitarComando('/ControleProduto', { btnop: 'Deletar', id: p.id }, 'POST');
                if (resp.dados.sucesso) {
                    salvarMensagemFlash('sucesso', resp.dados.msgSucesso);
                    window.location.href = 'produtos.html';
                } else {
                    exibirAlerta('mensagens', 'perigo', resp.dados.msgErro);
                }
            };
        } catch (erro) {
            exibirAlerta('mensagens', 'perigo', 'Erro ao carregar os detalhes do produto.');
        }
    }

    if (vendedor && idProduto) {
        carregarDetalhes();
    }
</script>
</body>
</html>
