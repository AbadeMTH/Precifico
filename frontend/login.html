<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Precifico • Entrar</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header>
    <div class="logotipo">Precifico</div>
</header>

<main style="max-width: 520px;">
    <div class="cabecalho-secao" style="justify-content: center; text-align: center; margin-bottom: 20px;">
        <div>
            <div class="sobretitulo">ACESSO DO VENDEDOR</div>
            <h1>Entrar na sua conta</h1>
        </div>
    </div>

    <div id="mensagens"></div>

    <div class="painel">
        <form id="form-login" novalidate>
            <div class="campos" style="grid-template-columns: 1fr;">
                <div class="campo">
                    <label for="email">E-mail *</label>
                    <input id="email" name="email" type="email" required placeholder="seu@email.com" autofocus>
                </div>
                <div class="campo">
                    <label for="senha">Senha *</label>
                    <input id="senha" name="senha" type="password" required placeholder="Sua senha de acesso">
                </div>
            </div>

            <div class="acoes" style="justify-content: space-between; align-items: center; margin-top: 24px;">
                <a href="cadastro_vendedor.html" style="color: var(--cor-marca); font-size: 14px; text-decoration: none; font-weight: 600;">Criar nova conta de vendedor →</a>
                <button type="submit" class="primario">Entrar no sistema</button>
            </div>
        </form>
    </div>
</main>

<script src="js/api.js"></script>
<script>
    verificarMensagemFlash('mensagens');

    document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        try {
            const { dados } = await requisitarComando('/ControleVendedor', {
                btnop: 'Entrar',
                email,
                senha
            }, 'POST');

            if (dados.sucesso && dados.vendedor) {
                salvarVendedorLogado(dados.vendedor);
                salvarMensagemFlash('sucesso', dados.msgSucesso);
                window.location.href = 'produtos.html';
            } else {
                exibirAlerta('mensagens', 'perigo', dados.msgErro || 'Não foi possível realizar o login.');
            }
        } catch (erro) {
            exibirAlerta('mensagens', 'perigo', 'Erro de conexão com o servidor Spring Boot (verifique se está rodando na porta 8080).');
        }
    });
</script>
</body>
</html>
