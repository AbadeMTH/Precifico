<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Precifico • Gerenciador de Produtos</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header>
    <div class="logotipo">Precifico</div>
    <div class="cabecalho-usuario">
        <span>Vendedor: <strong id="nome-vendedor-logado">...</strong></span>
        <a href="#" id="btn-sair" class="botao botao-pequeno botao-perigo" style="text-decoration:none;">Sair</a>
    </div>
</header>

<main>
    <div class="cabecalho-secao">
        <div>
            <h1>Meus Produtos Cadastrados</h1>
        </div>
        <a href="formulario_produto.html" class="botao botao-primario" style="text-decoration:none;">+ Novo Produto</a>
    </div>

    <div id="mensagens"></div>

    <div id="container-produtos" class="painel" style="padding: 0; overflow: hidden;">
        <div class="painel-vazio">
            <p>Carregando produtos...</p>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script>
    const vendedor = exigirAutenticacao();
    verificarMensagemFlash('mensagens');

    function escaparHtml(texto) {
        const div = document.createElement('div');
        div.textContent = texto || '';
        return div.innerHTML;
    }

    async function carregarProdutos() {
        const container = document.getElementById('container-produtos');
        try {
            const { dados } = await requisitarComando('/ControleProduto', { btnop: 'ConsultarTodos' }, 'GET');

            if (!dados.sucesso) {
                exibirAlerta('mensagens', 'perigo', dados.msgErro || 'Não foi possível carregar os produtos.');
                return;
            }

            const listaProdutos = dados.listaProdutos || [];
            if (listaProdutos.length === 0) {
                container.innerHTML = `
                    <div class="painel-vazio">
                        <h2 style="margin-bottom: 8px;">Nenhum produto cadastrado ainda</h2>
                        <a href="formulario_produto.html" class="botao botao-primario" style="margin-top: 10px; text-decoration:none;">Cadastrar primeiro produto →</a>
                    </div>
                `;
                return;
            }

            const linhasHtml = listaProdutos.map(p => {
                const prec = p.precificacao || {};
                const custo = prec.custoProduto || 0.0;
                const venda = prec.valorVenda || 0.0;
                const lucro = prec.lucro || 0.0;
                const margem = prec.margemEfetiva || 0.0;
                const disponivel = String(p.situacao).toUpperCase() === 'DISPONIVEL';
                const urlFoto = (p.imagem && p.imagem.trim() !== '') ? p.imagem : 'img/sem-foto.jpg';

                return `
                    <tr>
                        <td>
                            <img src="${escaparHtml(urlFoto)}" alt="${escaparHtml(p.nome)}" class="miniatura"
                                 onerror="this.onerror=null; this.src='img/sem-foto.jpg';">
                        </td>
                        <td>
                            <strong>${escaparHtml(p.codigoProduto)}</strong>
                        </td>
                        <td>
                            <strong>${escaparHtml(p.nome)}</strong>
                            <small style="max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escaparHtml(p.descricao)}</small>
                        </td>
                        <td>
                            R$ ${formatarDecimal(custo, 2)}
                        </td>
                        <td>
                            <strong>R$ ${formatarDecimal(venda, 2)}</strong>
                        </td>
                        <td>
                            <strong style="color: ${lucro >= 0 ? 'var(--cor-marca)' : '#9a382c'};">
                                R$ ${formatarDecimal(lucro, 2)}
                            </strong>
                            <small>${formatarDecimal(margem, 1)}% sobre o custo</small>
                        </td>
                        <td>
                            <span class="selo ${disponivel ? 'selo-disponivel' : 'selo-vendido'}">
                                ${escaparHtml(p.situacao)}
                            </span>
                        </td>
                        <td style="text-align: right; white-space: nowrap;">
                            <a href="detalhe_produto.html?id=${p.id}" class="botao botao-pequeno" title="Visualizar Detalhes e Precificação">Visualizar</a>
                            <a href="formulario_produto.html?id=${p.id}" class="botao botao-pequeno" title="Editar Produto">Editar</a>
                            <button type="button" class="botao botao-pequeno" onclick="alternarSituacao(${p.id})" title="Alternar Disponível / Vendido">
                                ${disponivel ? 'Marcar Vendido' : 'Reativar'}
                            </button>
                            <button type="button" class="botao botao-pequeno botao-perigo" onclick="excluirProduto(${p.id}, '${escaparHtml(p.nome).replace(/'/g, "\\'")}')" title="Excluir Produto">
                                Excluir
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            container.innerHTML = `
                <div class="tabela-responsiva">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 70px;">Foto</th>
                                <th>Código</th>
                                <th>Produto / Descrição</th>
                                <th>Custo</th>
                                <th>Preço de Venda</th>
                                <th>Lucro Estimado</th>
                                <th>Situação</th>
                                <th style="text-align: right;">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${linhasHtml}
                        </tbody>
                    </table>
                </div>
            `;
        } catch (erro) {
            if (erro.message !== 'Não autenticado') {
                exibirAlerta('mensagens', 'perigo', 'Falha ao conectar com a API do servidor.');
            }
        }
    }

    async function alternarSituacao(id) {
        try {
            const { dados } = await requisitarComando('/ControleProduto', { btnop: 'AlterarSituacao', id }, 'POST');
            if (dados.sucesso) {
                exibirAlerta('mensagens', 'sucesso', dados.msgSucesso);
                await carregarProdutos();
            } else {
                exibirAlerta('mensagens', 'perigo', dados.msgErro);
            }
        } catch (erro) {
            exibirAlerta('mensagens', 'perigo', 'Erro ao alterar situação do produto.');
        }
    }

    async function excluirProduto(id, nome) {
        if (!confirm(`Tem certeza que deseja excluir o produto ${nome}?`)) {
            return;
        }
        try {
            const { dados } = await requisitarComando('/ControleProduto', { btnop: 'Deletar', id }, 'POST');
            if (dados.sucesso) {
                exibirAlerta('mensagens', 'sucesso', dados.msgSucesso);
                await carregarProdutos();
            } else {
                exibirAlerta('mensagens', 'perigo', dados.msgErro);
            }
        } catch (erro) {
            exibirAlerta('mensagens', 'perigo', 'Erro ao excluir o produto.');
        }
    }

    if (vendedor) {
        carregarProdutos();
    }
</script>
</body>
</html>
