<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Precifico • Gerenciador de Produtos</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header>
    <div class="logotipo">Precifico</div>
    <div class="cabecalho-usuario">
        <span>Vendedor: <strong id="nome-vendedor-logado">...</strong></span>
        <a href="#" id="btn-sair" class="botao botao-pequeno botao-perigo" style="text-decoration:none;">Sair</a>
    </div>
</header>

<main>
    <div class="cabecalho-secao">
        <div>
            <h1>Meus Produtos Cadastrados</h1>
        </div>
        <a href="formulario_produto.html" class="botao botao-primario" style="text-decoration:none;">+ Novo Produto</a>
    </div>

    <div id="mensagens"></div>

    <div id="container-produtos" class="painel" style="padding: 0; overflow: hidden;">
        <div class="painel-vazio">
            <p>Carregando produtos...</p>
        </div>
    </div>
</main>

<script src="js/httpClient.js"></script>
<script src="js/sessao.js"></script>
<script src="js/authServico.js"></script>
<script src="js/produtoServico.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
    const { sessao, authServico, produtoServico } = window.PrecificoApp;
    const vendedor = exigirAutenticacao(sessao, authServico);
    verificarMensagemFlash('mensagens', sessao);

    async function carregarProdutos() {
        const container = document.getElementById('container-produtos');
        try {
            const resposta = await produtoServico.listarTodos();
            if (tratarNaoAutorizado(resposta, sessao)) {
                return;
            }

            if (!resposta.sucesso) {
                exibirAlerta('mensagens', 'perigo', resposta.mensagem || 'Não foi possível carregar os produtos.');
                return;
            }

            const listaProdutos = resposta.dados || [];
            if (listaProdutos.length === 0) {
                container.innerHTML = `
                    <div class="painel-vazio">
                        <h2 style="margin-bottom: 8px;">Nenhum produto cadastrado ainda</h2>
                        <a href="formulario_produto.html" class="botao botao-primario" style="margin-top: 10px; text-decoration:none;">Cadastrar primeiro produto →</a>
                    </div>
                `;
                return;
            }

            const linhasHtml = listaProdutos.map(function (produto) {
                const precificacao = produto.precificacao || {};
                const custo = precificacao.custoProduto || 0.0;
                const venda = precificacao.valorVenda || 0.0;
                const lucro = precificacao.lucro || 0.0;
                const margem = precificacao.margemEfetiva || 0.0;
                const disponivel = String(produto.situacao).toUpperCase() === 'DISPONIVEL';
                const urlFoto = (produto.imagem && produto.imagem.trim() !== '') ? produto.imagem : 'img/sem-foto.jpg';

                return `
                    <tr>
                        <td>
                            <img src="${escaparHtml(urlFoto)}" alt="${escaparHtml(produto.nome)}" class="miniatura"
                                 onerror="this.onerror=null; this.src='img/sem-foto.jpg';">
                        </td>
                        <td>
                            <strong>${escaparHtml(produto.codigoProduto)}</strong>
                        </td>
                        <td>
                            <strong>${escaparHtml(produto.nome)}</strong>
                            <small style="max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escaparHtml(produto.descricao)}</small>
                        </td>
                        <td>
                            R$ ${formatarDecimal(custo, 2)}
                        </td>
                        <td>
                            <strong>R$ ${formatarDecimal(venda, 2)}</strong>
                        </td>
                        <td>
                            <strong style="color: ${lucro >= 0 ? 'var(--cor-marca)' : '#9a382c'};">
                                R$ ${formatarDecimal(lucro, 2)}
                            </strong>
                            <small>${formatarDecimal(margem, 1)}% sobre o custo</small>
                        </td>
                        <td>
                            <span class="selo ${disponivel ? 'selo-disponivel' : 'selo-vendido'}">
                                ${escaparHtml(produto.situacao)}
                            </span>
                        </td>
                        <td style="text-align: right; white-space: nowrap;">
                            <a href="detalhe_produto.html?id=${produto.id}" class="botao botao-pequeno" title="Visualizar Detalhes e Precificação">Visualizar</a>
                            <a href="formulario_produto.html?id=${produto.id}" class="botao botao-pequeno" title="Editar Produto">Editar</a>
                            <button type="button" class="botao botao-pequeno" onclick="alternarSituacao(${produto.id})" title="Alternar Disponível / Vendido">
                                ${disponivel ? 'Marcar Vendido' : 'Reativar'}
                            </button>
                            <button type="button" class="botao botao-pequeno botao-perigo" onclick="excluirProduto(${produto.id}, '${escaparHtml(produto.nome).replace(/'/g, "\\'")}')" title="Excluir Produto">
                                Excluir
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            container.innerHTML = `
                <div class="tabela-responsiva">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 70px;">Foto</th>
                                <th>Código</th>
                                <th>Produto / Descrição</th>
                                <th>Custo</th>
                                <th>Preço de Venda</th>
                                <th>Lucro Estimado</th>
                                <th>Situação</th>
                                <th style="text-align: right;">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${linhasHtml}
                        </tbody>
                    </table>
                </div>
            `;
        } catch (erro) {
            exibirAlerta('mensagens', 'perigo', 'Falha ao conectar com a API do servidor.');
        }
    }

    async function alternarSituacao(id) {
        try {
            const resposta = await produtoServico.alterarSituacao(id);
            if (tratarNaoAutorizado(resposta, sessao)) {
                return;
            }

            if (resposta.sucesso) {
                exibirAlerta('mensagens', 'sucesso', resposta.mensagem);
                await carregarProdutos();
                return;
            }

            exibirAlerta('mensagens', 'perigo', resposta.mensagem || 'Erro ao alterar situação do produto.');
        } catch (erro) {
            exibirAlerta('mensagens', 'perigo', 'Erro ao alterar situação do produto.');
        }
    }

    async function excluirProduto(id, nome) {
        if (!confirm(`Tem certeza que deseja excluir o produto ${nome}?`)) {
            return;
        }
        try {
            const resposta = await produtoServico.deletar(id);
            if (tratarNaoAutorizado(resposta, sessao)) {
                return;
            }

            if (resposta.sucesso) {
                exibirAlerta('mensagens', 'sucesso', resposta.mensagem);
                await carregarProdutos();
                return;
            }

            exibirAlerta('mensagens', 'perigo', resposta.mensagem || 'Erro ao excluir o produto.');
        } catch (erro) {
            exibirAlerta('mensagens', 'perigo', 'Erro ao excluir o produto.');
        }
    }

    if (vendedor) {
        carregarProdutos();
    }
</script>
</body>
</html>
