server.port=8080
spring.application.name=precifico-backend

# Configuracoes do Banco de Dados MySQL (utilizadas pela FabricaConexao)
precifico.db.url=jdbc:mysql://localhost:3306/precifico?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
precifico.db.username=root
precifico.db.password=root

# Configuracoes de Sessao / Cookies para permitir comunicacao com Frontend separado
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Opcional: permite acessar o frontend diretamente em http://localhost:8080/ alem de servidor estatico externo (Live Server)
spring.web.resources.static-locations=classpath:/static/,file:./frontend/,file:../frontend/

