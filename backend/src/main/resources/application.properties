server.port=8080
spring.application.name=precifico-backend

# Configuracoes de Sessao / Cookies para permitir comunicacao com Frontend separado
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Opcional: permite acessar o frontend diretamente em http://localhost:8080/ alem de servidor estatico externo (Live Server)
spring.web.resources.static-locations=classpath:/static/,file:./frontend/,file:../frontend/

